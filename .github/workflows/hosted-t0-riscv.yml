name: autoresearch-hosted-t0-riscv

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full candidate commit SHA
        required: true
        type: string
      frontier_commit:
        description: Full canonical RISC-V frontier commit SHA
        required: true
        type: string
      preregistration_sha256:
        description: SHA-256 of the frozen local preregistration
        required: true
        type: string
      preregistration_audit_sha256:
        description: SHA-256 of the passing preregistration audit
        required: true
        type: string
      candidate_diff_sha256:
        description: SHA-256 of the canonical binary full-index diff
        required: true
        type: string
      candidate_source_sha256:
        description: SHA-256 of the sole changed source file
        required: true
        type: string

permissions:
  contents: read

jobs:
  t0:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0

      - name: Bind frozen inputs before execution
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          FRONTIER_COMMIT: ${{ inputs.frontier_commit }}
          PREREGISTRATION_SHA256: ${{ inputs.preregistration_sha256 }}
          PREREGISTRATION_AUDIT_SHA256: ${{ inputs.preregistration_audit_sha256 }}
          CANDIDATE_DIFF_SHA256: ${{ inputs.candidate_diff_sha256 }}
          CANDIDATE_SOURCE_SHA256: ${{ inputs.candidate_source_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p hosted-t0
          actual_candidate=$(git rev-parse HEAD)
          test "$actual_candidate" = "$CANDIDATE_COMMIT"
          git cat-file -e "${FRONTIER_COMMIT}^{commit}"
          git merge-base --is-ancestor "$FRONTIER_COMMIT" "$CANDIDATE_COMMIT"
          actual_paths=$(git diff --name-only --no-renames "$FRONTIER_COMMIT" "$CANDIDATE_COMMIT")
          test "$actual_paths" = "src/frontends/riscv/air/lookups/tables/interaction.zig"
          frontier_mode=$(git ls-tree "$FRONTIER_COMMIT" -- src/frontends/riscv/air/lookups/tables/interaction.zig | cut -d' ' -f1)
          candidate_mode=$(git ls-tree "$CANDIDATE_COMMIT" -- src/frontends/riscv/air/lookups/tables/interaction.zig | cut -d' ' -f1)
          test "$frontier_mode" = "100644"
          test "$candidate_mode" = "$frontier_mode"
          actual_diff=$(git diff --binary --full-index --no-renames "$FRONTIER_COMMIT" "$CANDIDATE_COMMIT" | sha256sum | cut -d' ' -f1)
          test "$actual_diff" = "$CANDIDATE_DIFF_SHA256"
          actual_source=$(sha256sum src/frontends/riscv/air/lookups/tables/interaction.zig | cut -d' ' -f1)
          test "$actual_source" = "$CANDIDATE_SOURCE_SHA256"
          jq -n \
            --arg candidate_commit "$CANDIDATE_COMMIT" \
            --arg candidate_tree "$(git rev-parse HEAD^{tree})" \
            --arg frontier_commit "$FRONTIER_COMMIT" \
            --arg frontier_tree "$(git rev-parse "${FRONTIER_COMMIT}^{tree}")" \
            --arg preregistration_sha256 "$PREREGISTRATION_SHA256" \
            --arg preregistration_audit_sha256 "$PREREGISTRATION_AUDIT_SHA256" \
            --arg candidate_diff_sha256 "$actual_diff" \
            --arg candidate_source_sha256 "$actual_source" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "stwo-riscv-hosted-t0-input-binding/v1",
              candidate: {
                commit: $candidate_commit,
                tree: $candidate_tree,
                diff_sha256: $candidate_diff_sha256,
                source_sha256: $candidate_source_sha256,
                changed_paths: ["src/frontends/riscv/air/lookups/tables/interaction.zig"]
              },
              frontier: {commit: $frontier_commit, tree: $frontier_tree},
              preregistration: {
                sha256: $preregistration_sha256,
                audit_sha256: $preregistration_audit_sha256
              },
              workflow: {
                ref: $workflow_ref,
                run_id: $run_id,
                run_attempt: $run_attempt
              }
            }' > hosted-t0/input-binding.json
          PYTHONPATH=autoresearch/cli python3 - <<'PY' \
            | tee hosted-t0/source-policy.log
          from pathlib import Path
          from stwo_perf import manifest as manifest_mod

          changed = ["src/frontends/riscv/air/lookups/tables/interaction.zig"]
          manifest = manifest_mod.load(Path.cwd())
          violations, strays = manifest.classify_touched(changed, board="riscv")
          if violations:
              raise SystemExit(f"locked paths changed: {violations}")
          if strays:
              raise SystemExit(f"paths outside riscv editable set: {strays}")
          print(
              "board-aware source policy: PASS "
              "(board=riscv, one editable path, mode=100644)"
          )
          PY

      - name: Validate the locked harness
        run: |
          set -o pipefail
          python3 -m unittest discover -s autoresearch/tests -v \
            2>&1 | tee hosted-t0/harness-tests.log

      - name: Install pinned Zig toolchain
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Run source and package controls
        run: |
          set -euo pipefail
          {
            zig version
            zig fmt --check src/frontends/riscv/air/lookups/tables/interaction.zig
            git diff --check "${{ inputs.frontier_commit }}" "${{ inputs.candidate_commit }}"
            python3 scripts/check_source_conformance.py
            python3 scripts/check_riscv_cpu_product.py
            (
              cd src/frontends/riscv
              zig build test -Doptimize=ReleaseFast
            )
          } 2>&1 | tee hosted-t0/source-and-package-controls.log

      - name: Run the production RISC-V proof gate
        run: |
          set -euo pipefail
          {
            zig build test-riscv-cpu-product stwo-zig-riscv-cpu \
              -Doptimize=ReleaseFast -j2
            python3 scripts/riscv_pr_proof_smoke.py \
              --cli zig-out/bin/stwo-zig-riscv-cpu \
              --artifact-dir hosted-t0/riscv-pr-proof-smoke \
              --report-out hosted-t0/riscv-pr-proof-smoke.json
            python3 scripts/riscv_trace_vectors.py
          } 2>&1 | tee hosted-t0/production-proof-gate.log

      - name: Materialize the exact predecessor
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/frontier" \
            "${{ inputs.frontier_commit }}"

      - name: Run the one-shot hosted T0
        run: |
          set -o pipefail
          timeout 1800s python3 autoresearch/cli/stwo-perf ladder t0 \
            --board riscv \
            --class small \
            --phase riscv_interaction_commit \
            --predecessor "$RUNNER_TEMP/frontier" \
            --out hosted-t0/t0-result.json \
            2>&1 | tee hosted-t0/t0.log

      - name: Record terminal environment
        if: always()
        run: |
          set -euo pipefail
          jq -n \
            --arg completed_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg os "$(uname -srvmo)" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg job_status "${{ job.status }}" \
            '{
              schema: "stwo-riscv-hosted-t0-environment/v1",
              completed_at_utc: $completed_at_utc,
              os: $os,
              runner_name: $runner_name,
              runner_arch: $runner_arch,
              workflow_sha: $workflow_sha,
              job_status: $job_status
            }' > hosted-t0/environment.json

      - name: Upload the complete T0 packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autoresearch-riscv-hosted-t0-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-t0/
          if-no-files-found: error
