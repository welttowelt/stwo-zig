name: autoresearch-hosted-t1-riscv-elide-table-previous

on:
  push:
    branches:
      - agent/hosted-t1-riscv-elide-table-previous-v2-88cbab63

permissions:
  contents: read

concurrency:
  group: autoresearch-hosted-t1-riscv-elide-table-previous-v2-88cbab63
  cancel-in-progress: false

jobs:
  t1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the frozen controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Bind controller, candidate, and preregistration
        env:
          EXPECTED_CONTROLLER_BRANCH: agent/hosted-t1-riscv-elide-table-previous-v2-88cbab63
        run: |
          set -euo pipefail
          binding=".github/hosted-t1/riscv-elide-table-previous-v2-88cbab63.json"
          test -f "$binding"
          jq -e '
            .schema == "stwo-riscv-hosted-t1-run-binding/v1" and
            .controller.branch == "agent/hosted-t1-riscv-elide-table-previous-v2-88cbab63" and
            .controller.harness_git_automaintenance_disabled == true and
            .candidate.branch == "agent/riscv-elide-table-previous-v2-88cbab63" and
            .candidate.changed_paths == [
              "src/frontends/riscv/air/lookups/tables/component.zig",
              "src/frontends/riscv/air/lookups/tables/interaction.zig",
              "src/frontends/riscv/prover/proof_finalize.zig"
            ] and
            (.candidate.source_sha256 | keys) == .candidate.changed_paths and
            .toolchain.zig == "0.15.2" and
            .experiment.board == "riscv" and
            .experiment.class == "small" and
            .experiment.fast_boundary == false and
            .experiment.boundary == "verified_request_ms" and
            .experiment.t1_cost_target_seconds == 300 and
            .t0_gate.run_id == "30565077179" and
            .t0_gate.run_attempt == "1" and
            .t0_gate.pass == true and
            .t0_gate.correctness_smoke_pass == true and
            .t0_gate.relative_move >= .t0_gate.min_phase_move and
            .t0_gate.predecessor_proof_digest == .t0_gate.candidate_proof_digest
          ' "$binding" >/dev/null

          controller_branch=$(jq -er '.controller.branch' "$binding")
          workflow_source_commit=$(jq -er '.controller.workflow_source_commit' "$binding")
          expected_workflow_sha256=$(jq -er '.controller.workflow_sha256' "$binding")
          candidate_branch=$(jq -er '.candidate.branch' "$binding")
          candidate_commit=$(jq -er '.candidate.commit' "$binding")
          candidate_tree=$(jq -er '.candidate.tree' "$binding")
          frontier_commit=$(jq -er '.frontier.commit' "$binding")
          frontier_tree=$(jq -er '.frontier.tree' "$binding")
          preregistration_sha256=$(jq -er '.preregistration.sha256' "$binding")
          preregistration_audit_sha256=$(jq -er '.preregistration.audit_sha256' "$binding")
          candidate_diff_sha256=$(jq -er '.candidate.diff_sha256' "$binding")
          t0_result_sha256=$(jq -er '.t0_gate.result_sha256' "$binding")

          test "$controller_branch" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$candidate_branch" in
            agent/*) ;;
            *) exit 1 ;;
          esac
          for value in \
            "$workflow_source_commit" "$candidate_commit" "$candidate_tree" \
            "$frontier_commit" "$frontier_tree"; do
            test "${#value}" -eq 40
            test -z "$(printf '%s' "$value" | tr -d '0-9a-f')"
          done
          for value in \
            "$expected_workflow_sha256" "$preregistration_sha256" \
            "$preregistration_audit_sha256" "$candidate_diff_sha256" \
            "$t0_result_sha256"; do
            test "${#value}" -eq 64
            test -z "$(printf '%s' "$value" | tr -d '0-9a-f')"
          done

          git cat-file -e "${workflow_source_commit}^{commit}"
          git merge-base --is-ancestor "$workflow_source_commit" "$GITHUB_SHA"
          actual_workflow_sha256=$(
            sha256sum .github/workflows/hosted-t1-riscv.yml | cut -d' ' -f1
          )
          test "$actual_workflow_sha256" = "$expected_workflow_sha256"

          git fetch --no-tags origin \
            "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
          remote_candidate=$(git rev-parse "refs/remotes/origin/$candidate_branch")
          test "$remote_candidate" = "$candidate_commit"
          git cat-file -e "${frontier_commit}^{commit}"
          git merge-base --is-ancestor "$frontier_commit" "$candidate_commit"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$candidate_commit"

          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = \
            "$candidate_commit"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD^{tree})" = \
            "$candidate_tree"
          test "$(
            git -C "$RUNNER_TEMP/candidate" \
              rev-parse "${frontier_commit}^{tree}"
          )" = "$frontier_tree"
          actual_paths=$(
            git -C "$RUNNER_TEMP/candidate" diff --name-only --no-renames \
              "$frontier_commit" "$candidate_commit"
          )
          expected_paths=$(jq -r '.candidate.changed_paths[]' "$binding")
          test "$actual_paths" = "$expected_paths"
          while IFS= read -r path; do
            frontier_mode=$(
              git -C "$RUNNER_TEMP/candidate" ls-tree "$frontier_commit" -- \
                "$path" | cut -d' ' -f1
            )
            candidate_mode=$(
              git -C "$RUNNER_TEMP/candidate" ls-tree "$candidate_commit" -- \
                "$path" | cut -d' ' -f1
            )
            test "$frontier_mode" = "100644"
            test "$candidate_mode" = "$frontier_mode"
          done < <(jq -r '.candidate.changed_paths[]' "$binding")
          actual_diff_sha256=$(
            git -C "$RUNNER_TEMP/candidate" \
              diff --binary --full-index --no-renames \
              "$frontier_commit" "$candidate_commit" |
              sha256sum | cut -d' ' -f1
          )
          test "$actual_diff_sha256" = "$candidate_diff_sha256"
          while IFS=$'\t' read -r path expected_source_sha256; do
            test "${#expected_source_sha256}" -eq 64
            test -z "$(
              printf '%s' "$expected_source_sha256" | tr -d '0-9a-f'
            )"
            actual_source_sha256=$(
              sha256sum "$RUNNER_TEMP/candidate/$path" | cut -d' ' -f1
            )
            test "$actual_source_sha256" = "$expected_source_sha256"
          done < <(
            jq -r '.candidate.source_sha256 | to_entries[] |
              [.key, .value] | @tsv' "$binding"
          )

          mkdir -p hosted-t1
          cp "$binding" hosted-t1/run-binding.json
          jq \
            --arg controller_commit "$GITHUB_SHA" \
            --arg controller_tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {
              runtime: {
                controller_commit: $controller_commit,
                controller_tree: $controller_tree,
                workflow_ref: $workflow_ref,
                run_id: $run_id,
                run_attempt: $run_attempt
              }
            }' "$binding" > hosted-t1/input-binding.json
          {
            echo "CANDIDATE_COMMIT=$candidate_commit"
            echo "FRONTIER_COMMIT=$frontier_commit"
          } >> "$GITHUB_ENV"

      - name: Run board-aware source policy
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          PYTHONPATH=autoresearch/cli python3 - <<'PY' \
            | tee "$GITHUB_WORKSPACE/hosted-t1/source-policy.log"
          from pathlib import Path
          from stwo_perf import manifest as manifest_mod

          changed = [
              "src/frontends/riscv/air/lookups/tables/component.zig",
              "src/frontends/riscv/air/lookups/tables/interaction.zig",
              "src/frontends/riscv/prover/proof_finalize.zig",
          ]
          manifest = manifest_mod.load(Path.cwd())
          violations, strays = manifest.classify_touched(changed, board="riscv")
          if violations:
              raise SystemExit(f"locked paths changed: {violations}")
          if strays:
              raise SystemExit(f"paths outside riscv editable set: {strays}")
          print(
              "board-aware source policy: PASS "
              "(board=riscv, three editable paths, mode=100644)"
          )
          PY

      - name: Bind the claimed phase to the live report schema
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -o pipefail
          PYTHONPATH=autoresearch/cli python3 - <<'PY' \
            | tee "$GITHUB_WORKSPACE/hosted-t1/phase-binding.log"
          from pathlib import Path
          from stwo_perf import manifest as manifest_mod
          from stwo_perf import runner

          manifest = manifest_mod.load(Path.cwd())
          group = manifest.group("riscv")
          if group.report_schema != "riscv_proof_v2":
              raise SystemExit(
                  f"unexpected RISC-V report schema: {group.report_schema!r}"
              )
          phases = runner.PHASE_SECONDS_FIELDS.get(group.report_schema, {})
          if "prove" not in phases:
              raise SystemExit(
                  f"claimed phase 'prove' absent from {group.report_schema}: "
                  f"{sorted(phases)}"
              )
          print(
              "claimed phase binding: PASS "
              f"(group={group.group_id}, schema={group.report_schema}, "
              f"phase=prove, measured={sorted(phases)})"
          )
          PY

      - name: Validate the locked harness
        working-directory: ${{ runner.temp }}/candidate
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: gc.auto
          GIT_CONFIG_VALUE_0: "0"
          GIT_CONFIG_KEY_1: maintenance.auto
          GIT_CONFIG_VALUE_1: "false"
        run: |
          set -o pipefail
          python3 -m unittest discover -s autoresearch/tests -v \
            2>&1 | tee "$GITHUB_WORKSPACE/hosted-t1/harness-tests.log"

      - name: Install pinned Zig toolchain
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Run source and package controls
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          {
            zig version
            zig fmt --check \
              src/frontends/riscv/air/lookups/tables/component.zig \
              src/frontends/riscv/air/lookups/tables/interaction.zig \
              src/frontends/riscv/prover/proof_finalize.zig
            git diff --check "$FRONTIER_COMMIT" "$CANDIDATE_COMMIT"
            python3 scripts/check_source_conformance.py
            python3 scripts/check_riscv_cpu_product.py
            (
              cd src/frontends/riscv
              zig build test -Doptimize=ReleaseFast
            )
          } 2>&1 |
            tee "$GITHUB_WORKSPACE/hosted-t1/source-and-package-controls.log"

      - name: Run the production RISC-V proof gate
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          {
            zig build test-riscv-cpu-product stwo-zig-riscv-cpu \
              -Doptimize=ReleaseFast -j2
            python3 scripts/riscv_pr_proof_smoke.py \
              --cli zig-out/bin/stwo-zig-riscv-cpu \
              --artifact-dir \
                "$GITHUB_WORKSPACE/hosted-t1/riscv-pr-proof-smoke" \
              --report-out \
                "$GITHUB_WORKSPACE/hosted-t1/riscv-pr-proof-smoke.json"
            python3 scripts/riscv_trace_vectors.py
          } 2>&1 |
            tee "$GITHUB_WORKSPACE/hosted-t1/production-proof-gate.log"

      - name: Materialize the exact predecessor
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/frontier" "$FRONTIER_COMMIT"

      - name: Run the hosted T1 ABBA estimate
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -o pipefail
          timeout 1800s python3 autoresearch/cli/stwo-perf ladder t1 \
            --board riscv \
            --class small \
            --predecessor "$RUNNER_TEMP/frontier" \
            --out "$GITHUB_WORKSPACE/hosted-t1/t1-result.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/hosted-t1/t1.log"

      - name: Record terminal environment
        if: always()
        run: |
          set -euo pipefail
          workflow_sha256=$(
            sha256sum .github/workflows/hosted-t1-riscv.yml |
              cut -d' ' -f1
          )
          jq -n \
            --arg completed_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg os "$(uname -srvmo)" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg controller_commit "$GITHUB_SHA" \
            --arg controller_tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha256 "$workflow_sha256" \
            --arg job_status "${{ job.status }}" \
            '{
              schema: "stwo-riscv-hosted-t1-environment/v1",
              completed_at_utc: $completed_at_utc,
              os: $os,
              runner_name: $runner_name,
              runner_arch: $runner_arch,
              controller_commit: $controller_commit,
              controller_tree: $controller_tree,
              workflow_ref: $workflow_ref,
              workflow_sha256: $workflow_sha256,
              job_status: $job_status
            }' > hosted-t1/environment.json

      - name: Upload the complete T1 packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autoresearch-riscv-hosted-t1-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-t1/
          if-no-files-found: error
